    <rect x="1010" y="880" width="180" height="380" rx="18" fill="rgba(27,161,73,0.18)" stroke="#1BA149" stroke-width="4" />
    <text x="1100" y="1090" font-size="64" font-weight="700" fill="#fff">12</text>
    <rect x="1010" y="1300" width="180" height="380" rx="18" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.16)" stroke-width="4" stroke-dasharray="14 12" />
