    <rect x="530" y="460" width="180" height="380" rx="18" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.2)" stroke-width="4" />
    <text x="620" y="670" font-size="64" font-weight="700" fill="rgba(255,255,255,0.45)">5</text>
    <rect x="770" y="460" width="180" height="380" rx="18" fill="rgba(27,161,73,0.18)" stroke="#1BA149" stroke-width="4" />
