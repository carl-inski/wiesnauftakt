    <text x="1100" y="670" font-size="64" font-weight="700" fill="rgba(255,255,255,0.45)">7</text>
    <rect x="50" y="880" width="180" height="380" rx="18" fill="rgba(27,161,73,0.18)" stroke="#1BA149" stroke-width="4" />
